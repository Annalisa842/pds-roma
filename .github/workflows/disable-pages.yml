name: Disable Pages after 24h

on:
  schedule:
    # Runs once at 2026-10-05 22:11 UTC (24h after enabling)
    - cron: "11 22 5 10 *"
  workflow_dispatch: {}   # allow manual trigger too

permissions:
  pages: write
  administration: write

jobs:
  disable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Disable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Disabling GitHub Pages for ${{ github.repository }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "HTTP status: $code"
          if [ "$code" = "204" ] || [ "$code" = "404" ]; then
            echo "Pages disabled (or already off)."
          else
            echo "Unexpected status $code"; exit 1
          fi
